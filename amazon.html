<!DOCTYPE html>
<html>
    <head>
       <title>Amazon Project</title>
       <meta name="viewport" content="width=device-width, initial-scale=1.0">

       <link rel="stylesheet" href="amazon-styles/shared/amazon-header.css"
       <link rel="stylesheet" href=""
    </head>
    <body>

        <div class="amazon-header">
            <div class="amazon-header-left">
                <a href="amazon.html" class="amazon-logo">
                    <img class="amazon-logo" src="amazon-images/amazon-logo-white.png">
                    <img class="amazon-logo-mobile" src="amazon-images/amazon-mobile-logo-white.png">
                </a>
            </div>

            <div class="amazon-header-middle">
                <input class="searchbar" type="text" placeholder="Search">
                <button class="search-button">
                    <img class="search-icon" src="amazon-images/icons/search-icon.png">
                </button>
            </div>

            <div class="amazon-header-right">
                <a class="order-link header-link" href="orders.html">
                    <span class="returns-text">Returns</span>
                    <span class="orders-text">& Orders</span>
                </a>

                <a class="cart-link header-link" href="checkout.html">
                    <img class="cart-icon" src="amazon-images/icons/cart-icon.png">
                    <div class="cart-quantity js-cart-quantity">0</div>
                    <div class="cart-text">Cart</div>
                </a>
            </div>
        </div>

        <div class="main">
            <div class="products-grid js-products-grid">
            </div>
        </div>
        <script src=""></script>
        <script src=""></script>
        <script src=""></script>
    </body>
</html>
